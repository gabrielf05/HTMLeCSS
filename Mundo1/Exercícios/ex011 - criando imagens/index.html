<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Midias em HTML5</title>
</head>

<body>
<!-- Multiplas imagens para tamanhos de tela diferentes -->
 <h1>Imagens dinâmicas</h1>
 <p>tente abrir esse site em vários dispositivos diferentes ou simplesmente aumente e diminua o tamanho do seu navegador
 </p>

 <picture>
    <source media="(max-width: 750px )" srcset="imagens/pequena.png" type="image/png">
    <source media="(max-width: 1050px )" srcset="imagens/media.png" type="image/png">
    <img src="imagens/grande.png" alt="imagem flexível">
 </picture>

<h1>Reproduzindo áudios</h1>
<p>vamos aprender a reproduzir áudios em HTML5</p>
<audio src="midia/happy-mistake.mp3.mp3" controls autoplay></audio>
<!-- MP3, WAV, OGG -->

<audio preload="metadata" autoplay controls> 
    <source src="midia/guanacast-33.mp3.mp3" type="audio/mpeg">
    <source src="midia/guanacast-33.mp3.ogg" type="audio/ogg">
    <source src="midia/guanacast-33.mp3.wav" type="audio/wav">
    <p>Infelizmente seu navegador não consegue reproduzir este áudio. <a href="midia/guanacast-33.mp3.mp3" dowload>Clique aqui para baixar o arquivo MP3</a></p>
</audio>


</body>

</html>
