<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vídeos com HTML5</title>
</head>

<body>
<h1>Inserindo vídeos hospedados localmente</h1>
<!--Handbrake para hospedar vídeos no sistema do cliente-->
<p>Este vídeo está hospedado no meu próprio servidor</p>
<video height="400" width="400" poster="midias/media.png" controls autoplay loop>
    <source src="midias/meu-video.mp4"  type="video/mp4">
    <source src="midias/meu-video.ogg" type="video/ogg">
    <source src="midias/meu-video.webm" type="video/webm">
    <p>Seu navegador não suporta o elemento de vídeo.</p>
</video>

<h1>Inserindo vídeos do Youtube</h1>

<iframe width="560" height="315" src="https://www.youtube.com/embed/OzUnqQk4eOg?si=U8B474HfR-IcjoDS" title="YouTube video player" frameborder="0" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" referrerpolicy="strict-origin-when-cross-origin" allowfullscreen></iframe>

</body>


</html>
